project:
  type: book
  output-dir: docs

toc: true
number-sections: false
toc-depth: 3
number-depth: 4
bibliography: book.bib
csl: ims.csl

crossref:
  labels: arabic        # (default is arabic)
  subref-labels: roman i # (default is alpha a)

execute: 
  freeze: auto
  eval: false


metadata-files:
  - _variables.yml

jupyter: core

format:
  bookup-html:
        toc: true
        toc-depth: 3
        css: blocks.css

book:
  title: "Datasets Collection"
  author: "Xinli Xiao"
  date: last-modified
  chapters: 
    - index.qmd
    - part: Regression
      chapters:
        - contents/regression/QSR.qmd
        - contents/regression/student_performance.qmd
        - contents/regression/bike_sharing.qmd
        - contents/regression/auto_mpg.qmd
        - contents/regression/wine_quality.qmd
        - contents/regression/heart_disease.qmd
        - contents/regression/forest_fires.qmd
        - contents/regression/energy_efficiency.qmd
        - contents/regression/airfoil_self_noise.qmd
        - contents/regression/parkinsons_telemonitoring.qmd
        - contents/regression/abalone.qmd
        - contents/regression/concrete_compressive_strength.qmd
        - contents/regression/electrical_grid_stability.qmd
        - contents/regression/seoul_bike_sharing.qmd
        - contents/regression/gas_turbine_emissions.qmd
        - contents/regression/superconductivity.qmd
        - contents/regression/appliances_energy_prediction.qmd
        - contents/regression/air_quality.qmd
        - contents/regression/communities_and_crime_unnormalized.qmd
