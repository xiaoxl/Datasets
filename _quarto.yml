      chapters:
        - contents/no_targets/ds4psy.qmd
        - contents/no_targets/faker.qmd
  sidebar:
    style: "docked"
    pinned: false
    align: center
    border: true
    search: true
    collapse-level: 1
    title: "Datasets Collection <br> {{< meta datetime.semester >}} {{< meta datetime.year >}}"
